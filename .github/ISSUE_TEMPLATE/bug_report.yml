name: Bug report
description: The SnackStudio site is not behaving as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction is the fastest path to a fix. Do not include credentials.
  - type: input
    id: version
    attributes:
      label: Commit or deployment
      description: The commit hash, or the page URL you saw it on.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, or the commands you ran (for example `npm run build` or `npm test`) and their output.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Say whether camera permission was granted and whether the pantry API was configured.
      placeholder: browser and version, device, OS, Node version
