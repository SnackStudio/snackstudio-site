name: Feature request
description: Propose a change to the site.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The change you want
      description: What should the site do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
